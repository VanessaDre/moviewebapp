{% extends "base.html" %}

{% block content %}
  <h1>Movies for {{ user.name }}</h1>

  <form action="{{ url_for('add_movie', user_id=user.id) }}" method="post">
    <label for="title">Add movie:</label>
    <input id="title" name="title" type="text" required>
    <button type="submit">Add</button>
  </form>

  <ul>
    {% for movie in movies %}
      <li>
        {{ movie.name }}{% if movie.year %} ({{ movie.year }}){% endif %}
        <form action="{{ url_for('update_movie', user_id=user.id, movie_id=movie.id) }}" method="post" style="display:inline;">
          <input name="new_title" type="text" placeholder="New title" required>
          <button type="submit">Update</button>
        </form>

        <form action="{{ url_for('delete_movie', user_id=user.id, movie_id=movie.id) }}" method="post" style="display:inline;">
          <button type="submit">Delete</button>
        </form>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
