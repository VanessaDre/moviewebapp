{% extends "base.html" %}

{% block content %}
  <h1 class="page-title">Users</h1>

  <div class="grid users-grid">
    {% for user in users %}
      <div class="card user-card">
        <div class="user-name">{{ user.name }}</div>
        <a class="btn btn-primary" href="{{ url_for('user_movies', user_id=user.id) }}">View Movies</a>
      </div>
    {% endfor %}
  </div>

  <div class="card add-card">
    <h2 class="section-title">Add New User</h2>
    <form class="form-row" action="{{ url_for('create_user') }}" method="post">
      <input class="input" name="name" type="text" placeholder="User name" required>
      <button class="btn btn-primary" type="submit">Add User</button>
    </form>
  </div>
{% endblock %}
